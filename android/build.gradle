import java.util.Properties

plugins {
    id 'com.android.application'
}

// === VERSIONADO ===
// Permite subir versionCode/versionName desde CI sin tocar el repo:
//   ./gradlew bundleRelease -PappVersionCode=42 -PappVersionName=1.2.0
// o via variables de entorno APP_VERSION_CODE / APP_VERSION_NAME.
def versionCodeValue = (
    System.getenv('APP_VERSION_CODE')
    ?: project.findProperty('appVersionCode')
    ?: '1'
).toString().toInteger()

def versionNameValue = (
    System.getenv('APP_VERSION_NAME')
    ?: project.findProperty('appVersionName')
    ?: '1.0.0'
).toString()

// === FIRMA ===
// keystore.properties NO se sube al repo (esta en .gitignore).
// En CI se genera desde los secrets antes de compilar.
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.darkphoenixteam.kawaiinekomemory'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darkphoenixteam.kawaiinekomemory'
        minSdk 23
        targetSdk 36
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            
            // Firmado solo si existe keystore.properties; sin el, el build
            // sigue funcionando (AAB sin firmar) para no romper el CI.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            
            // Play distribuye solo ABIs ARM en telefonos/tablets.
            // x86/x86_64 quedan para el APK debug (emulador).
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    
    // AAB: no dividir por idioma; los .properties de i18n van en assets/
    // y los assets no se dividen, pero lo dejamos explicito por claridad.
    bundle {
        language {
            enableSplit = false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

configurations {
    natives
}

// Tarea de ayuda: avisa si se intenta publicar sin firma
// === VERIFICACION 16 KB ===
// Google Play exige que las librerias nativas soporten paginas de 16 KB.
// Se comprueba el alineamiento de los segmentos PT_LOAD de cada .so.
// Corre automaticamente despues de assembleDebug (sin tocar el workflow).
tasks.register('verify16kb') {
    group = 'verification'
    description = 'Comprueba alineamiento 16 KB de las librerias nativas'
    
    doLast {
        def readelf = ['readelf', 'llvm-readelf'].find { tool ->
            try {
                def p = new ProcessBuilder(tool, '--version').redirectErrorStream(true).start()
                p.inputStream.text
                p.waitFor() == 0
            } catch (Exception ignored) { false }
        }
        
        if (readelf == null) {
            logger.warn('[16kb] readelf no disponible: verificacion omitida')
            return
        }
        
        def libs = fileTree("$buildDir/intermediates") {
            include '**/lib/**/*.so'
        }.files.findAll { it.exists() }
        
        if (libs.isEmpty()) {
            logger.warn('[16kb] No se encontraron .so para verificar')
            return
        }
        
        def malas = []
        libs.each { so ->
            def p = new ProcessBuilder(readelf, '-lW', so.absolutePath)
                .redirectErrorStream(true).start()
            def salida = p.inputStream.text
            p.waitFor()
            
            // Cada PT_LOAD debe tener p_align >= 0x4000 (16 KB)
            def alineaciones = salida.readLines()
                .findAll { it.trim().startsWith('LOAD') }
                .collect { linea ->
                    def m = linea =~ /0x([0-9a-fA-F]+)\s*$/
                    m.find() ? Long.parseLong(m.group(1), 16) : -1L
                }
            if (alineaciones.isEmpty() || alineaciones.any { it < 0x4000L }) {
                malas << so.name + ' ' + alineaciones
            }
        }
        
        logger.lifecycle("[16kb] Revisadas " + libs.size() + " librerias nativas")
        if (!malas.isEmpty()) {
            throw new GradleException("[16kb] Librerias SIN soporte 16 KB (Play las rechazara): " + malas.join(', '))
        }
        logger.lifecycle('[16kb] OK: todas las .so soportan paginas de 16 KB')
    }
}

tasks.named('assembleDebug').configure {
    finalizedBy 'verify16kb'
}

tasks.register('checkSigning') {
    doLast {
        if (!hasKeystore) {
            logger.warn("[firma] Sin keystore.properties: el AAB saldra SIN FIRMAR y Play lo rechazara.")
        } else {
            logger.lifecycle("[firma] keystore.properties detectado: AAB firmado con alias '" + keystoreProps['keyAlias'] + "'.")
        }
        logger.lifecycle("[version] versionCode=" + versionCodeValue + " versionName=" + versionNameValue)
    }
}

tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    dependsOn 'checkSigning'
}

dependencies {
    implementation project(':core')
    
    def gdxVersion = '1.13.5'
    
    // LibGDX Backend
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    
    // LibGDX Natives
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    
    // FreeType para fuentes TTF
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyNatives') {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()
    }
    
    doLast {
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.contains("natives-armeabi-v7a")) {
                outputDir = file("libs/armeabi-v7a")
            } else if (jar.name.contains("natives-arm64-v8a")) {
                outputDir = file("libs/arm64-v8a")
            } else if (jar.name.contains("natives-x86_64")) {
                outputDir = file("libs/x86_64")
            } else if (jar.name.contains("natives-x86")) {
                outputDir = file("libs/x86")
            }
            
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyNatives'
}